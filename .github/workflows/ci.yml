name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Lint
        run: uvx ruff check .
      - name: Validate policies
        run: uv run --python 3.12 ztgate validate policies
      - name: Test
        run: uv run --python 3.12 --group dev pytest -q

  policy-gate:
    # Replays 30 days of access attempts against the policies in this commit. Fails unless every planted risky
    # event is denied or stepped up and false denies for legitimate users stay under 2%.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Gate on the repo policies
        run: uv run --python 3.12 ztgate gate --max-false-deny-rate 0.02 --summary gate-summary.md
      - name: Publish the gate summary
        if: always()
        run: test -f gate-summary.md && cat gate-summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: The gate fails on a loosened overlay
        run: |
          set +e
          uv run --python 3.12 ztgate gate --overlay examples/policies-weak > /dev/null
          code=$?
          set -e
          test "$code" -eq 1

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t zero-trust-gate:ci .
      - name: Smoke test the stack
        env:
          ZTGATE_SIGNING_KEY: ci-only-key-not-a-secret
        run: |
          docker compose up -d
          for i in $(seq 1 60); do curl -sf http://localhost:8862/healthz && break; sleep 2; done
          curl -sf http://localhost:8861/healthz
          curl -sf http://localhost:8861/metrics | grep ztgate_planted_events_caught
          docker compose run --rm --no-deps -e ZTGATE_SIGNING_KEY admin \
            ztgate demo --admin http://admin:8861 --proxy http://proxy:8862
          docker compose down
