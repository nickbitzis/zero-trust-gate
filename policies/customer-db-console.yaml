# Customer DB console: Read and fix customer records in production.
app: customer-db-console
name: Customer DB console
sensitivity: high
owner: sre
allow_groups: [support-tier2, sre]
device:
  min_trust: high
  read_only_trust: medium
risk:
  step_up_above: 25
  deny_above: 50
mfa:
  max_age_minutes: 480
step_up:
  actions: [write, export, admin]
  mfa_max_age_minutes: 30
location:
  allowed_countries: [US, CA, GB, DE, IE, IN, PT]
session:
  lifetime_minutes: 240
  bind_to_device: true
