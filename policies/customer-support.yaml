# Support desk: Customer tickets and chat.
app: customer-support
name: Support desk
sensitivity: medium
owner: support
allow_groups: [support, contractors-support, sales]
device:
  min_trust: medium
  read_only_trust: low
risk:
  step_up_above: 30
  deny_above: 60
mfa:
  max_age_minutes: 720
step_up:
  actions: [export, admin]
  mfa_max_age_minutes: 30
session:
  lifetime_minutes: 480
  bind_to_device: true
