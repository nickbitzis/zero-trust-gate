# Feature flags: Flag rules for the product.
app: feature-flags
name: Feature flags
sensitivity: medium
owner: engineering
allow_groups: [engineering, product, sre]
device:
  min_trust: medium
  read_only_trust: low
risk:
  step_up_above: 30
  deny_above: 60
mfa:
  max_age_minutes: 720
step_up:
  actions: [export, admin]
  mfa_max_age_minutes: 30
session:
  lifetime_minutes: 480
  bind_to_device: true
