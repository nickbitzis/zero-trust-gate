# BI dashboards: Business metrics dashboards.
app: bi-dashboards
name: BI dashboards
sensitivity: medium
owner: data
allow_groups: [data, product, finance, exec, marketing]
device:
  min_trust: medium
  read_only_trust: low
risk:
  step_up_above: 30
  deny_above: 60
mfa:
  max_age_minutes: 720
step_up:
  actions: [export, admin]
  mfa_max_age_minutes: 30
session:
  lifetime_minutes: 480
  bind_to_device: true
