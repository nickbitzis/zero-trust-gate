# Status page admin: Incident posts on the public status page.
app: status-admin
name: Status page admin
sensitivity: medium
owner: sre
allow_groups: [sre, oncall]
device:
  min_trust: medium
  read_only_trust: low
risk:
  step_up_above: 30
  deny_above: 60
mfa:
  max_age_minutes: 720
step_up:
  actions: [export, admin]
  mfa_max_age_minutes: 30
session:
  lifetime_minutes: 480
  bind_to_device: true
