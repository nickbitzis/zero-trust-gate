# HR system: Employee records, reviews, and leave.
app: hr-system
name: HR system
sensitivity: high
owner: hr
allow_groups: [hr]
deny_groups: [contractors]
device:
  min_trust: high
  read_only_trust: medium
risk:
  step_up_above: 25
  deny_above: 50
mfa:
  max_age_minutes: 480
step_up:
  actions: [export, admin]
  mfa_max_age_minutes: 30
hours:
  start: 6
  end: 22
  outside: step_up
location:
  allowed_countries: [US, CA, GB, DE, IE, IN, PT]
session:
  lifetime_minutes: 240
  bind_to_device: true
