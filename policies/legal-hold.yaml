# Legal hold: Preserved mailboxes and documents.
app: legal-hold
name: Legal hold
sensitivity: high
owner: legal
allow_groups: [legal]
deny_groups: [contractors]
device:
  min_trust: high
  read_only_trust: medium
risk:
  step_up_above: 25
  deny_above: 50
mfa:
  max_age_minutes: 480
step_up:
  actions: [write, export, admin]
  mfa_max_age_minutes: 30
location:
  allowed_countries: [US, CA, GB, DE, IE, IN, PT]
session:
  lifetime_minutes: 240
  bind_to_device: true
