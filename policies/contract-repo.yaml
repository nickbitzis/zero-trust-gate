# Contract repository: Signed customer and vendor contracts.
app: contract-repo
name: Contract repository
sensitivity: medium
owner: legal
allow_groups: [legal, sales, finance]
device:
  min_trust: medium
  read_only_trust: low
risk:
  step_up_above: 30
  deny_above: 60
mfa:
  max_age_minutes: 720
step_up:
  actions: [export, admin]
  mfa_max_age_minutes: 30
session:
  lifetime_minutes: 480
  bind_to_device: true
