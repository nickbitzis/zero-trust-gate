# A "quick fix" for contractors locked out after a slow HR feed: stop checking that the identity is active.
# The CI gate must fail on this overlay, because the contractor whose contract ended gets back in (P5).
app: source-code
name: Source code
sensitivity: high
owner: engineering
allow_groups: [engineering, sre, security, data, contractors-eng, product]
device:
  min_trust: high
  read_only_trust: medium
risk:
  step_up_above: 25
  deny_above: 50
mfa:
  max_age_minutes: 480
step_up:
  actions: [export, admin]
  mfa_max_age_minutes: 30
location:
  allowed_countries: [US, CA, GB, DE, IE, IN, PT]
session:
  lifetime_minutes: 240
  bind_to_device: true
identity:
  require_active: false
